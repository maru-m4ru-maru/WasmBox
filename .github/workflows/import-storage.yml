name: Verify and import M1 storage ZIP

on:
  push:
    paths:
      - ".incoming/wasmbox-m1-storage/*.b64"
      - ".github/workflows/import-storage.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild and extract ZIP
        run: |
          mkdir -p /tmp/wasmbox-import
          cat .incoming/wasmbox-m1-storage/*.b64 | base64 -d > /tmp/wasmbox-m1-storage.zip
          unzip -t /tmp/wasmbox-m1-storage.zip
          unzip -q /tmp/wasmbox-m1-storage.zip -d /tmp/wasmbox-import
          cp -R /tmp/wasmbox-import/. .
          rm -rf /tmp/wasmbox-import /tmp/wasmbox-m1-storage.zip .incoming .github/workflows/import-storage.yml
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Create CI workflow and commit verified files
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'EOF'
          name: WasmBox CI

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                    cache: npm
                - run: npm ci
                - run: npm run typecheck
                - run: npm test
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement M1 storage layer"
          git push origin HEAD:main
