<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>WasmBox M2 PoC</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; max-width: 60rem; margin: 1.5rem auto; padding: 0 1rem; }
    #serial { width: 100%; height: 24rem; box-sizing: border-box; font: 13px/1.3 ui-monospace, monospace;
              background: #111; color: #ddd; border-radius: 6px; padding: .5rem; }
    #status { font: 12px ui-monospace, monospace; margin: .5rem 0; color: #555; }
    button { font: inherit; padding: .3rem .8rem; margin-right: .5rem; }
    @media (prefers-color-scheme: dark) { body { background: #1b1b1b; color: #ddd; } #status { color: #aaa; } a { color: #8ab4f8; } }
  </style>
</head>
<body>
  <h1>WasmBox M2 PoC</h1>
  <p>v86 のディスクとして BlockStore（IndexedDB）を接続しています。手順は <code>poc/README.md</code>。
     環境の診断は <a href="selftest.html">selftest.html</a>（v86 不要）。</p>
  <textarea id="serial" spellcheck="false" placeholder="ここにシリアルコンソールが表示されます。クリックしてから入力します。"></textarea>
  <div id="status">起動前</div>
  <button id="flush">今すぐ flush</button>
  <button id="reset">ディスクを初期化</button>

  <!-- v86 本体。poc/vendor/ に置く（poc/README.md 参照） -->
  <script src="vendor/libv86.js"></script>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
